<!doctype html>

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Body</title>
<style>
  /* One typeface, one size, one weight, one color — a plain-text terminal
     wrap-up, styled after the news digest: a single capture-line header, then
     sections set off by full-width dashed dividers with a centered label
     ("------ SUMMARY ------"). All structure is typed characters, not CSS rules. */
  /* Bloomberg Terminal palette (from ~/.vim/colors/bloomberg.vim):
     amber on black, green=up / red=down, cyan=values, dim amber=muted. */
  :root {
    --ink:#ffa500; --bg:#000000; --muted:#af5f00;
    --lead:#875f00; --up:#00d700; --down:#ff0000; --val:#00d7d7; --title:#ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'PingFang TC', monospace;
    font-size: 12pt; line-height: 1.5; font-weight: normal;
    font-variant-numeric: tabular-nums;
  }
  main { width: 74ch; max-width: 100%; margin: 2em auto 4em; padding: 0 1.2em; }

  /* capture-line header, e.g. "CC01 BODY   AS OF 2026-06-13   13 WEIGH-INS" */
  .masthead {
    text-transform: uppercase; letter-spacing: 0.04em;
    margin-bottom: 1.2em; white-space: pre-wrap;
    color: var(--title); font-weight: bold;
  }
  .masthead .meta { color: var(--muted); font-weight: normal; }

  pre { margin: 0; font: inherit; white-space: pre; overflow-x: auto; }
  pre.divider { margin-top: 1.5em; letter-spacing: 0.02em; color: var(--muted); }
  pre.cap { color: var(--muted); margin-top: 0.4em; }

  svg.chart { width: 100%; height: auto; max-width: 680px; display: block; margin-top: 0.5em; }
  .chart .ax  { stroke: #3a2800; stroke-width: 1; }          /* dim gridlines */
  .chart .ln  { fill: none; stroke: var(--ink); stroke-width: 1.6; }  /* amber line */
  .chart .dot { fill: var(--val); }                          /* cyan weigh-ins */
  .chart .lbl { fill: var(--muted); font-size: 12pt; }

  .lead { color: var(--lead); }   /* dotted leaders */
  .up   { color: var(--up); }     /* gain (ticker green) */
  .down { color: var(--down); }   /* loss (ticker red) */
  .val  { color: var(--val); }    /* numeric values (cyan) */
  .colhead { color: var(--muted); }

  #showOlder {
    font: inherit; color: var(--ink); background: transparent;
    border: 1px solid var(--muted); padding: 4px 12px; margin-top: 12px;
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;
  }
  #showOlder:hover { background: var(--ink); color: var(--bg); }
  #olderRows { margin-top: 0.4em; }

  .error { display: block; color: var(--down); }
  .error code { background: #1c1c1c; padding: 1px 4px; }
  code { font: inherit; }
</style>
</head>

let cachedSessions = null, cachedHealth = null, cachedErrors = [], olderOpen = false;

function parseWorkouts(md) {
  const sessions = [];
  let cur = null;
  for (const raw of md.split("\n")) {
    const line = raw.trim();
    const dateMatch = line.match(/^##\s+(\d{4}-\d{2}-\d{2})/);
    if (dateMatch) {
      if (cur) sessions.push(cur);
      cur = { date: dateMatch[1], items: {} };
      continue;
    }
    if (!cur) continue;
    const sportMatch = line.match(/^[-*]\s*sport\s*:\s*(.+)$/i);
    if (sportMatch) { cur.sport = sportMatch[1].trim(); continue; }
    const itemMatch = line.match(/^[-*]\s+([A-Za-z][A-Za-z\s\/-]*?):\s*(\d+(?:\.\d+)?)\s*(.*)$/);
    if (itemMatch) {
      const key = itemMatch[1].trim().toLowerCase();
      const val = parseFloat(itemMatch[2]);
      const trailing = (itemMatch[3] || "").trim();
      if (key.includes("weight")) {
        cur.items[key] = { value: val, unit: trailing, isMeasurement: true };
      } else {
        const prev = cur.items[key];
        const prevNum = (prev && typeof prev === "object") ? prev.value : (prev || 0);
        const notes = (prev && prev.notes) ? [...prev.notes] : [];
        if (trailing) notes.push(trailing);
        cur.items[key] = notes.length
          ? { value: prevNum + val, notes, isCount: true }
          : prevNum + val;
      }
    }
  }
  if (cur) sessions.push(cur);
  sessions.sort((a, b) => a.date.localeCompare(b.date));
  return sessions;
}

// Pull every weight measurement out of the parsed sessions, oldest first.
function weightSeries(sessions) {
  const pts = [];
  for (const s of sessions) {
    for (const [k, v] of Object.entries(s.items)) {
      if (!k.includes("weight")) continue;
      const val = (v && typeof v === "object") ? v.value : v;
      if (typeof val === "number" && !isNaN(val)) pts.push({ date: s.date, w: val, k });
    }
  }
  pts.sort((a, b) => a.date.localeCompare(b.date));
  return pts;
}

const PUSH_NAMES = ["push-ups", "pushups", "push ups", "pushup", "push-up"];
const SQUAT_NAMES = ["squats", "squat"];
const PULL_NAMES = ["pull-ups", "pull ups", "pullups", "pullup", "pull-up"];

// Total reps + set breakdown for an exercise in a session (sums day + night).
// Returns { value, label } where label is e.g. "100 (10 x 10)", or null.
function exercise(s, names) {
  let total = null;
  const notes = [];
  for (const k in s.items) {
    const base = k.replace(/\s+(night|day)$/, "").trim();
    if (names.indexOf(base) !== -1) {
      const v = s.items[k];
      total = (total || 0) + ((v && typeof v === "object") ? v.value : v);
      if (v && v.notes) for (const n of v.notes) notes.push(n);
    }
  }
  if (total == null) return null;
  return { value: total, label: total + (notes.length ? " " + notes.join(" ") : "") };
}

// Per-day pushup / squat / pullup + sport, oldest first.
function workoutSeries(sessions) {
  const rows = [];
  for (const s of sessions) {
    const push = exercise(s, PUSH_NAMES);
    const squat = exercise(s, SQUAT_NAMES);
    const pull = exercise(s, PULL_NAMES);
    const sport = s.sport || null;
    if (push || squat || pull || sport) {
      rows.push({ date: s.date, push, squat, pull, sport });
    }
  }
  return rows;
}

const DAY = 864e5;
const COLS = 72;

// A full-width dashed divider with the label centered, matching the news
// digest's section rules: "------------- SUMMARY -------------".
function divider(label, cols) {
  const c = cols || COLS;
  const tag = " " + label + " ";
  const dash = Math.max(0, c - tag.length);
  const left = Math.floor(dash / 2);
  return "-".repeat(left) + tag + "-".repeat(dash - left);
}

// A standard line chart (SVG): amber line connecting each weigh-in, cyan dots
// at the actual measurements, dim grid + axis labels. Scales to its container.
function svgWeightChart(pts) {
  if (pts.length < 2) return "<pre>Not enough weigh-ins to plot a trend yet.</pre>";
  const W = 680, H = 240, mL = 46, mR = 14, mT = 12, mB = 26;
  const iw = W - mL - mR, ih = H - mT - mB;
  const ws = pts.map(p => p.w);
  let lo = Math.min(...ws), hi = Math.max(...ws);
  const pad = (hi - lo || 1) * 0.12;
  hi = Math.ceil((hi + pad) * 2) / 2;
  lo = Math.floor((lo - pad) * 2) / 2;
  const t0 = Date.parse(pts[0].date), t1 = Date.parse(pts[pts.length - 1].date);
  const tspan = (t1 - t0) || 1;
  const X = d => mL + (Date.parse(d) - t0) / tspan * iw;
  const Y = w => mT + (hi - w) / (hi - lo) * ih;
  const f = n => n.toFixed(1);

  let g = "";
  const ticks = 5;
  for (let i = 0; i <= ticks; i++) {
    const wv = hi - (hi - lo) * i / ticks, yy = Y(wv);
    g += "<line x1='" + mL + "' y1='" + f(yy) + "' x2='" + (W - mR) + "' y2='" + f(yy) + "' class='ax'/>";
    g += "<text x='" + (mL - 6) + "' y='" + f(yy + 3) + "' class='lbl' text-anchor='end'>" + f(wv) + "</text>";
  }
  // x-axis: major tick at each month start (full gridline + month label) and a
  // minor tick on the 15th. Labels are dropped when they would overlap; months
  // are placed first so they win ties.
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const Xms = ms => mL + (ms - t0) / tspan * iw;
  const charW = 10, gap = 8, placed = [];
  const fits = (x, text) => {
    const hw = text.length * charW / 2, lo = x - hw - gap, hi = x + hw + gap;
    for (const p of placed) if (!(hi < p.lo || lo > p.hi)) return false;
    placed.push({ lo, hi }); return true;
  };
  const lbl = (x, t) => "<text x='" + f(x) + "' y='" + (H - 8) + "' class='lbl' text-anchor='middle'>" + t + "</text>";
  const d0 = new Date(t0);

  // collect month starts in range, then draw majors (label has priority)
  const majors = [];
  let yr = d0.getUTCFullYear(), mo = d0.getUTCMonth(), ms1 = Date.UTC(yr, mo, 1);
  if (ms1 < t0) { if (++mo > 11) { mo = 0; yr++; } ms1 = Date.UTC(yr, mo, 1); }
  while (ms1 <= t1) { majors.push({ ms: ms1, m: mo }); if (++mo > 11) { mo = 0; yr++; } ms1 = Date.UTC(yr, mo, 1); }

  let xl = "";
  for (const j of majors) {
    const xx = Xms(j.ms);
    xl += "<line x1='" + f(xx) + "' y1='" + mT + "' x2='" + f(xx) + "' y2='" + (mT + ih) + "' class='ax'/>";
    if (fits(xx, MON[j.m])) xl += lbl(xx, MON[j.m]);
  }
  // minor ticks: the 15th of each month in range
  yr = d0.getUTCFullYear(); mo = d0.getUTCMonth();
  let ms15 = Date.UTC(yr, mo, 15);
  if (ms15 < t0) { if (++mo > 11) { mo = 0; yr++; } ms15 = Date.UTC(yr, mo, 15); }
  while (ms15 <= t1) {
    const xx = Xms(ms15);
    if (fits(xx, "15")) {
      xl += "<line x1='" + f(xx) + "' y1='" + (mT + ih - 5) + "' x2='" + f(xx) + "' y2='" + (mT + ih) + "' class='ax'/>";
      xl += lbl(xx, "15");
    }
    if (++mo > 11) { mo = 0; yr++; } ms15 = Date.UTC(yr, mo, 15);
  }
  if (!majors.length) {  // range shorter than a month: fall back to endpoint dates
    xl += "<text x='" + f(X(pts[0].date)) + "' y='" + (H - 8) + "' class='lbl' text-anchor='start'>" + pts[0].date.slice(5) + "</text>";
    xl += "<text x='" + f(X(pts[pts.length - 1].date)) + "' y='" + (H - 8) + "' class='lbl' text-anchor='end'>" + pts[pts.length - 1].date.slice(5) + "</text>";
  }
  const line = pts.map(p => f(X(p.date)) + "," + f(Y(p.w))).join(" ");
  const dots = pts.map(p => "<circle cx='" + f(X(p.date)) + "' cy='" + f(Y(p.w)) + "' r='2.4' class='dot'/>").join("");
  return "<svg viewBox='0 0 " + W + " " + H + "' class='chart' preserveAspectRatio='xMidYMid meet' role='img' aria-label='weight line chart'>" +
    g + "<polyline points='" + line + "' class='ln'/>" + dots + xl + "</svg>";
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function titleCase(s) { return s.replace(/\b\w/g, c => c.toUpperCase()); }
function sec(title, body, cols) { return "<pre class='divider'>" + esc(divider(title, cols)) + "</pre>" + body; }

// How many monospace characters fit across the content column right now, so the
// fixed-width layout fits the screen (phone or desktop) instead of overflowing.
function fitCols() {
  const main = document.querySelector("main");
  if (!main) return COLS;
  const cs = getComputedStyle(main);
  const inner = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const probe = document.createElement("span");
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:inherit";
  probe.textContent = "0".repeat(40);
  main.appendChild(probe);
  const charW = probe.getBoundingClientRect().width / 40 || 8;
  probe.remove();
  return Math.max(30, Math.min(COLS, Math.floor(inner / charW)));
}

function render(sessions, health, errors) {
  const sub = document.getElementById("subtitle");
  const content = document.getElementById("content");
  const pts = weightSeries(sessions);
  const cols = fitCols();

  if (!pts.length) {
    if (sub) sub.textContent = "NO WEIGHT DATA";
    content.innerHTML = sec("WEIGHT", "<pre>No weight entries found in workout.md.</pre>", cols);
    return;
  }

  const latest = pts[pts.length - 1];
  if (sub) sub.textContent = "";

  const fmt = w => w.toFixed(1);
  const sgn = d => (d >= 0 ? "+" : "-") + Math.abs(d).toFixed(1);
  const onOrBefore = ms => { let r = null; for (const p of pts) if (Date.parse(p.date) <= ms) r = p; return r; };
  const lms = Date.parse(latest.date);
  const p7 = onOrBefore(lms - 7 * DAY);
  const p30 = onOrBefore(lms - 30 * DAY);
  const lo = pts.reduce((a, b) => b.w < a.w ? b : a);
  const hi = pts.reduce((a, b) => b.w > a.w ? b : a);
  const last30 = pts.filter(p => Date.parse(p.date) >= lms - 30 * DAY);
  const avg30 = last30.reduce((a, b) => a + b.w, 0) / last30.length;
  const daysSpan = Math.round((lms - Date.parse(pts[0].date)) / DAY);
  const tag = latest.k.replace("weight", "").trim().toUpperCase();

  // A leader row: LABEL ....... VALUE, with the dots dim and the value colored.
  const kvHTML = (label, value, cls) => {
    const dots = ".".repeat(Math.max(1, cols - label.length - value.length - 2));
    const v = cls ? "<span class='" + cls + "'>" + esc(value) + "</span>" : esc(value);
    return esc(label) + " <span class='lead'>" + dots + "</span> " + v;
  };
  const deltaRow = (label, base) => {
    if (!base || base === latest) return kvHTML(label, "no data", "lead");
    const d = latest.w - base.w;
    return kvHTML(label, sgn(d) + " KG", d > 0 ? "up" : d < 0 ? "down" : null);
  };
  const summary = [
    kvHTML("LATEST", fmt(latest.w) + " KG  " + latest.date.slice(5) + (tag ? " " + tag : ""), "val"),
    deltaRow("CHANGE PAST 7 DAYS", p7),
    deltaRow("CHANGE PAST 30 DAYS", p30),
    deltaRow("CHANGE ALL TIME", pts[0]),
    kvHTML("AVERAGE PAST 30 DAYS", fmt(avg30) + " KG", "val"),
    kvHTML("LOWEST", fmt(lo.w) + " KG  " + lo.date.slice(5), "val"),
    kvHTML("HIGHEST", fmt(hi.w) + " KG  " + hi.date.slice(5), "val"),
    kvHTML("WEIGH-INS", pts.length + " over " + daysSpan + " days", "val"),
  ].join("\n");

  // ── workout section: pushups / squats / pullups / sport per day ─────────────
  let workoutBlock;
  const wrows = workoutSeries(sessions);
  if (!wrows.length) {
    workoutBlock = sec("WORKOUT", "<pre>No pushup or squat entries found.</pre>", cols);
  } else {
    const wl = wrows[wrows.length - 1];
    const sum = key => wrows.reduce((a, r) => a + (r[key] ? r[key].value : 0), 0);
    const dset = new Set(wrows.map(r => r.date));
    let streak = 0, dms = Date.parse(wl.date);
    while (dset.has(new Date(dms).toISOString().slice(0, 10))) { streak++; dms -= DAY; }
    let latestLine = wl.date.slice(5) + "  " + (wl.push ? wl.push.value : "-") + " pushups / " + (wl.squat ? wl.squat.value : "-") + " squats / " + (wl.pull ? wl.pull.value : "-") + " pullups";
    if (wl.sport) latestLine += " / " + titleCase(wl.sport);
    const wsummary = [
      kvHTML("LATEST", latestLine, "val"),
      kvHTML("STREAK", streak + " days", "up"),
      kvHTML("TOTAL PUSHUPS", String(sum("push")), "val"),
      kvHTML("TOTAL SQUATS", String(sum("squat")), "val"),
      kvHTML("TOTAL PULLUPS", String(sum("pull")), "val"),
      kvHTML("DAYS LOGGED", String(wrows.length), "val"),
    ].join("\n");
    // A table (header + rows) sized to its own content; each cell is "total (sets)".
    // The table scrolls horizontally on narrow screens.
    const G = esc("  ");
    const labOf = (r, k) => (r[k] ? r[k].label : "-");
    const sportCell = sp => sp ? esc(titleCase(sp)) : "<span class='lead'>-</span>";
    const buildTable = rowsArr => {
      const colW = (k, header) => Math.max(header.length, ...rowsArr.map(r => labOf(r, k).length));
      const wP = colW("push", "PUSHUPS"), wS = colW("squat", "SQUATS"), wU = colW("pull", "PULLUPS");
      const cell = (r, k, w) => {
        const s = labOf(r, k);
        return "<span class='" + (r[k] ? "val" : "lead") + "'>" + esc(s) + "</span>" + esc(" ".repeat(Math.max(0, w - s.length)));
      };
      const head = "<span class='colhead'>" +
        esc("DATE".padEnd(8)) + G + esc("PUSHUPS".padEnd(wP)) + G + esc("SQUATS".padEnd(wS)) + G + esc("PULLUPS".padEnd(wU)) + G + esc("SPORT") + "</span>";
      const body = rowsArr.map(r =>
        esc(r.date.slice(5).padEnd(8)) + G + cell(r, "push", wP) + G + cell(r, "squat", wS) + G + cell(r, "pull", wU) + G + sportCell(r.sport)
      ).join("\n");
      return head + "\n" + body;
    };

    const recent = wrows.slice(-14).reverse();
    const older = wrows.slice(0, -14).reverse();
    let body = "<pre>" + wsummary + "</pre>" +
      "<pre class='cap'>LAST 14 DAYS</pre>" +
      "<pre>" + buildTable(recent) + "</pre>";
    if (older.length) {
      body += "<pre id='olderRows'" + (olderOpen ? "" : " hidden") + ">" + buildTable(older) + "</pre>";
      body += "<button id='showOlder' type='button'>" +
        (olderOpen ? "HIDE OLDER" : "SHOW OLDER (" + older.length + " DAYS)") + "</button>";
    }
    workoutBlock = sec("WORKOUT", body, cols);
  }

  content.innerHTML =
    sec("SUMMARY", "<pre>" + summary + "</pre>", cols) +
    sec("WEIGHT  (KG)", svgWeightChart(pts) + "<pre class='cap'>line: weight over time   dot: weigh-in</pre>", cols) +
    workoutBlock;

  const btn = document.getElementById("showOlder");
  if (btn) btn.onclick = () => { olderOpen = !olderOpen; render(cachedSessions, cachedHealth, cachedErrors); };
}

let resizeTimer = null;
window.addEventListener("resize", () => {
  if (!cachedSessions) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => render(cachedSessions, cachedHealth, cachedErrors), 150);
});

load();
</script>
<div style="text-align:center;color:var(--muted);font-size:12pt;margin-top:24px;opacity:0.6;">build 2026-06-28 23:10</div>
</body>
</html>
