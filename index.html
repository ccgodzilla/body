<style>
  /* One typeface, one size, one weight, one color — a plain-text terminal
     wrap-up, styled after the news digest: a single capture-line header, then
     sections set off by full-width dashed dividers with a centered label
     ("------ SUMMARY ------"). All structure is typed characters, not CSS rules. */
  :root { --ink:#111; --bg:#fff; --muted:#777; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'PingFang TC', monospace;
    font-size: 13px; line-height: 1.5; font-weight: normal;
    font-variant-numeric: tabular-nums;
  }
  main { width: 74ch; max-width: 100%; margin: 2em auto 4em; padding: 0 1.2em; }

  /* capture-line header, e.g. "CC01 BODY   AS OF 2026-06-13   13 WEIGH-INS" */
  .masthead {
    text-transform: uppercase; letter-spacing: 0.04em;
    margin-bottom: 1.2em; white-space: pre-wrap;
  }
  .masthead .meta { color: var(--muted); }

  pre { margin: 0; font: inherit; white-space: pre; overflow-x: auto; }
  pre.divider { margin-top: 1.5em; letter-spacing: 0.02em; }
  pre.cap { color: var(--muted); margin-top: 0.4em; }

  .error { display: block; }
  .error code { background: #eee; padding: 1px 4px; }
  code { font: inherit; }
</style>

  const b64uDecode = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));

    if (keyBytes.length !== 32) throw new Error('key length ' + keyBytes.length + ' (expected 32)');

    const cryptoKey = await crypto.subtle.importKey('raw', keyBytes.buffer.slice(keyBytes.byteOffset, keyBytes.byteOffset + keyBytes.byteLength), { name: 'AES-GCM' }, false, ['decrypt']);

    plaintext = new TextDecoder().decode(buf);
  } catch (e) {
    console.error('decrypt failed:', e);
    sub.innerHTML = '<div class="error">Decrypt failed: ' + (e && e.message ? e.message : e) + '. <br>Key len: ' + (keyStr ? keyStr.length : 0) + '. <br>If on Safari, try Chrome to compare.</div>';

let cachedSessions = null, cachedHealth = null, cachedErrors = [];

function parseWorkouts(md) {
  const sessions = [];
  let cur = null;
  for (const raw of md.split("\n")) {
    const line = raw.trim();
    const dateMatch = line.match(/^##\s+(\d{4}-\d{2}-\d{2})/);
    if (dateMatch) {
      if (cur) sessions.push(cur);
      cur = { date: dateMatch[1], items: {} };
      continue;
    }
    if (!cur) continue;
    const itemMatch = line.match(/^[-*]\s+([A-Za-z][A-Za-z\s\/-]*?):\s*(\d+(?:\.\d+)?)\s*(.*)$/);
    if (itemMatch) {
      const key = itemMatch[1].trim().toLowerCase();
      const val = parseFloat(itemMatch[2]);
      const trailing = (itemMatch[3] || "").trim();
      if (key.includes("weight")) {
        cur.items[key] = { value: val, unit: trailing, isMeasurement: true };
      } else {
        const prev = cur.items[key];
        const prevNum = (prev && typeof prev === "object") ? prev.value : (prev || 0);
        const notes = (prev && prev.notes) ? [...prev.notes] : [];
        if (trailing) notes.push(trailing);
        cur.items[key] = notes.length
          ? { value: prevNum + val, notes, isCount: true }
          : prevNum + val;
      }
    }
  }
  if (cur) sessions.push(cur);
  sessions.sort((a, b) => a.date.localeCompare(b.date));
  return sessions;
}

// Pull every weight measurement out of the parsed sessions, oldest first.
function weightSeries(sessions) {
  const pts = [];
  for (const s of sessions) {
    for (const [k, v] of Object.entries(s.items)) {
      if (!k.includes("weight")) continue;
      const val = (v && typeof v === "object") ? v.value : v;
      if (typeof val === "number" && !isNaN(val)) pts.push({ date: s.date, w: val, k });
    }
  }
  pts.sort((a, b) => a.date.localeCompare(b.date));
  return pts;
}

const DAY = 864e5;
const COLS = 72;

// A full-width dashed divider with the label centered, matching the news
// digest's section rules: "------------- SUMMARY -------------".
function divider(label) {
  const tag = " " + label + " ";
  const dash = Math.max(0, COLS - tag.length);
  const left = Math.floor(dash / 2);
  return "-".repeat(left) + tag + "-".repeat(dash - left);
}

// A pure-text weight chart: '*' marks an actual weigh-in, '.' the trend between.
function asciiWeightChart(pts, cols) {
  if (pts.length < 2) return "Not enough weigh-ins to plot a trend yet.";
  const ws = pts.map(p => p.w);
  let lo = Math.min(...ws), hi = Math.max(...ws);
  const pad = (hi - lo || 1) * 0.1;
  hi = Math.ceil((hi + pad) * 2) / 2;
  lo = Math.floor((lo - pad) * 2) / 2;
  const H = 16, GUT = 7, W = cols - GUT;
  const t0 = Date.parse(pts[0].date), t1 = Date.parse(pts[pts.length - 1].date);
  const tspan = (t1 - t0) || 1;
  const colOf = d => Math.round((Date.parse(d) - t0) / tspan * (W - 1));
  const rowOf = w => Math.round((hi - w) / (hi - lo) * (H - 1));
  const grid = Array.from({ length: H }, () => Array(W).fill(" "));

  for (let i = 1; i < pts.length; i++) {
    const c0 = colOf(pts[i - 1].date), r0 = rowOf(pts[i - 1].w);
    const c1 = colOf(pts[i].date), r1 = rowOf(pts[i].w);
    const steps = Math.max(Math.abs(c1 - c0), Math.abs(r1 - r0));
    for (let s = 0; s <= steps; s++) {
      const c = steps ? Math.round(c0 + (c1 - c0) * s / steps) : c0;
      const r = steps ? Math.round(r0 + (r1 - r0) * s / steps) : r0;
      if (grid[r] && grid[r][c] === " ") grid[r][c] = ".";
    }
  }
  for (const p of pts) { const r = rowOf(p.w), c = colOf(p.date); if (grid[r]) grid[r][c] = "*"; }

  const lines = [];
  for (let r = 0; r < H; r++) {
    const wv = hi - r / (H - 1) * (hi - lo);
    const lab = (r === 0 || r === H - 1 || r % 4 === 0) ? wv.toFixed(1) : "";
    lines.push(lab.padStart(GUT - 2, " ") + " |" + grid[r].join(""));
  }
  lines.push(" ".repeat(GUT - 1) + "+" + "-".repeat(W));
  const a = pts[0].date.slice(5), b = pts[pts.length - 1].date.slice(5);
  lines.push(" ".repeat(GUT) + a + " ".repeat(Math.max(1, W - a.length - b.length)) + b);
  return lines.join("\n");
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function sec(title, body) { return "<pre class='divider'>" + esc(divider(title)) + "</pre>" + body; }

function render(sessions, health, errors) {
  const sub = document.getElementById("subtitle");
  const content = document.getElementById("content");
  const pts = weightSeries(sessions);

  if (!pts.length) {
    if (sub) sub.textContent = "NO WEIGHT DATA";
    content.innerHTML = sec("WEIGHT", "<pre>No weight entries found in workout.md.</pre>");
    return;
  }

  const latest = pts[pts.length - 1];
  if (sub) sub.textContent = "AS OF " + latest.date + "  ·  " + pts.length + " WEIGH-INS";

  const fmt = w => w.toFixed(1);
  const sgn = d => (d >= 0 ? "+" : "-") + Math.abs(d).toFixed(1);
  const onOrBefore = ms => { let r = null; for (const p of pts) if (Date.parse(p.date) <= ms) r = p; return r; };
  const lms = Date.parse(latest.date);
  const p7 = onOrBefore(lms - 7 * DAY);
  const p30 = onOrBefore(lms - 30 * DAY);
  const lo = pts.reduce((a, b) => b.w < a.w ? b : a);
  const hi = pts.reduce((a, b) => b.w > a.w ? b : a);
  const last30 = pts.filter(p => Date.parse(p.date) >= lms - 30 * DAY);
  const avg30 = last30.reduce((a, b) => a + b.w, 0) / last30.length;
  const daysSpan = Math.round((lms - Date.parse(pts[0].date)) / DAY);
  const tag = latest.k.replace("weight", "").trim().toUpperCase();

  const kv = (l, v) => l + " " + ".".repeat(Math.max(1, COLS - l.length - v.length - 2)) + " " + v;
  const summary = [
    kv("LATEST", fmt(latest.w) + " KG  " + latest.date.slice(5) + (tag ? " " + tag : "")),
    kv("CHANGE 7D", p7 && p7 !== latest ? sgn(latest.w - p7.w) + " KG" : "n/a"),
    kv("CHANGE 30D", p30 && p30 !== latest ? sgn(latest.w - p30.w) + " KG" : "n/a"),
    kv("CHANGE ALL", sgn(latest.w - pts[0].w) + " KG"),
    kv("30-DAY AVG", fmt(avg30) + " KG"),
    kv("LOW", fmt(lo.w) + " KG  " + lo.date.slice(5)),
    kv("HIGH", fmt(hi.w) + " KG  " + hi.date.slice(5)),
    kv("WEIGH-INS", pts.length + " over " + daysSpan + " days"),
  ].join("\n");

  content.innerHTML =
    sec("SUMMARY", "<pre>" + esc(summary) + "</pre>") +
    sec("WEIGHT TREND  (KG)",
      "<pre>" + esc(asciiWeightChart(pts, COLS)) + "</pre>" +
      "<pre class='cap'>* weigh-in   . trend</pre>") +
    sec("REMINDERS",
      "<pre>- Brush teeth GENTLY\n- Clean feet COMPLETELY (use soap)\n- Protect sleep</pre>");
}

load();
